<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      document.documentElement.classList.add("js");
    </script>
    <title>Founders Doc — A new feature is coming soon</title>
    <meta
      name="description"
      content="A new feature is coming to Founders Doc. Leave your email to hear first."
    />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light; /* light only, like the homepage */
        --white: #fff;
        --grey-1: #f4f4f4;
        --grey-2: #e9e9e9;
        --grey-3: #d6d6d6;
        --grey-4: #9a9a9a;
        --grey-5: #666;
        --black: #0f0f0f;
        --ink: #161616;
        --gold: #f3bf4b;
        --gold-soft: #fbeec9;
        --gold-deep: #c9962a;
        --display: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        --wrap: 1200px;
        --nav-h: 64px;
        --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
        --ok: #3d8b5f;
        --miss: #c8574a;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--white);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.6;
        letter-spacing: -0.005em;
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100svh;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
        border: none;
        background: none;
      }
      :focus-visible {
        outline: 2px solid var(--black);
        outline-offset: 3px;
      }
      .wrap {
        width: 100%;
        max-width: var(--wrap);
        margin-inline: auto;
        padding-inline: clamp(20px, 4vw, 40px);
      }

      /* nav */
      .nav {
        border-bottom: 1px solid var(--grey-2);
        background: var(--white);
      }
      .nav .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: var(--nav-h);
        max-width: 1440px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 9px;
        white-space: nowrap;
      }
      .logo img {
        display: block;
        height: 34px;
        width: auto;
      }
      .logo-word {
        font-family: var(--display);
        font-weight: 600;
        font-size: 17px;
        letter-spacing: 0.01em;
        color: var(--black);
      }
      .foot .logo-word {
        color: var(--white);
      }
      .back {
        font-size: 13px;
        font-weight: 500;
        color: var(--grey-5);
        transition: color 0.15s;
      }
      .back:hover {
        color: var(--black);
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        font-weight: 500;
        color: var(--grey-5);
      }
      .status i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 0 0 rgba(243, 191, 75, 0.55);
        animation: pulse 2.4s var(--ease) infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(243, 191, 75, 0.55);
        }
        70%,
        100% {
          box-shadow: 0 0 0 9px rgba(243, 191, 75, 0);
        }
      }

      /* hero */
      .hero {
        position: relative;
        flex: 1;
        display: flex;
        align-items: center;
        text-align: center;
        padding: 64px 0 96px;
        overflow: hidden;
        isolation: isolate;
      }
      .glow {
        position: absolute;
        z-index: -1;
        left: 50%;
        top: 50%;
        width: max(1400px, 96vw);
        height: max(1400px, 96vw);
        transform: translate(-50%, -38%);
        border-radius: 50%;
        pointer-events: none;
        background:
          radial-gradient(closest-side at 50% 42%, rgba(15, 15, 15, 0.05), rgba(15, 15, 15, 0) 72%),
          radial-gradient(closest-side at 36% 50%, rgba(243, 191, 75, 0.3), transparent 62%),
          radial-gradient(closest-side at 64% 46%, rgba(250, 205, 120, 0.26), transparent 60%),
          radial-gradient(closest-side at 50% 54%, rgba(243, 191, 75, 0.5), transparent 58%);
        filter: blur(48px) saturate(1.1);
        animation: drift 18s ease-in-out infinite alternate;
      }
      @keyframes drift {
        0% {
          transform: translate(-50%, -38%) rotate(0deg) scale(1);
        }
        50% {
          transform: translate(-47%, -41%) rotate(6deg) scale(1.04);
        }
        100% {
          transform: translate(-53%, -36%) rotate(-5deg) scale(0.98);
        }
      }
      .hero h1 {
        font-family: var(--display);
        font-weight: 500;
        letter-spacing: -0.025em;
        font-size: clamp(64px, 12vw, 160px);
        line-height: 0.98;
        letter-spacing: -0.04em;
        margin: 0 auto;
      }
      .hero h1 .line {
        display: block;
        overflow: hidden;
        padding: 0.02em 0 0.12em;
        margin-bottom: -0.12em;
      }
      .hero h1 .line > span {
        display: block;
      }
      .caret {
        display: none;
        width: 0.06em;
        height: 0.82em;
        margin-left: 0.06em;
        vertical-align: -0.04em;
        background: var(--gold);
        border-radius: 1px;
      }
      html.js.typing .caret {
        display: inline-block;
        animation: blink 0.9s steps(2, start) infinite;
      }
      html.js.loaded .caret {
        display: inline-block;
        animation: blink 0.9s steps(2, start) infinite, caret-out 0.4s var(--ease) 1.4s forwards;
      }
      @keyframes blink {
        to {
          opacity: 0;
        }
      }
      @keyframes caret-out {
        to {
          opacity: 0;
          width: 0;
          margin-left: 0;
        }
      }
      .sig {
        display: block;
        width: 72px;
        height: 2px;
        background: var(--gold);
        margin: 34px auto 0;
      }
      .hero .sub {
        color: var(--grey-5);
        margin: 22px auto 40px;
        max-width: 40ch;
        font-size: clamp(16px, 1.3vw, 19px);
        line-height: 1.6;
      }

      /* notify form */
      .notify {
        max-width: 440px;
        margin: 0 auto;
      }
      .notify label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        margin-bottom: 10px;
      }
      .notify .field {
        display: flex;
        border: 1px solid var(--grey-3);
        border-radius: 6px;
        overflow: hidden;
        background: var(--white);
        transition: border-color 0.15s, box-shadow 0.15s var(--ease);
      }
      .notify .field:focus-within {
        border-color: var(--black);
        box-shadow: 0 8px 16px -10px rgba(15, 15, 15, 0.45);
      }
      .notify input {
        flex: 1;
        min-width: 0;
        border: none;
        background: transparent;
        padding: 12px 14px;
        font: inherit;
        color: var(--ink);
        outline: none;
      }
      .notify input::placeholder {
        color: var(--grey-4);
      }
      .notify button {
        background: var(--gold);
        color: var(--black);
        padding: 0 18px;
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        transition: background 0.15s;
      }
      .notify button:hover {
        background: #e9b23a;
      }
      .notify .msg {
        margin-top: 10px;
        font-size: 12.5px;
        min-height: 1.4em;
        color: var(--grey-5);
      }
      .notify .msg.ok {
        color: var(--ok);
      }
      .notify .msg.err {
        color: var(--miss);
      }

      /* rotating line */
      .cycle {
        margin-top: 56px;
        font-size: 13.5px;
        color: var(--grey-5);
        display: flex;
        justify-content: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .cycle .w-wrap {
        position: relative;
        display: inline-block;
        color: var(--black);
        font-weight: 500;
        text-align: left;
      }
      .cycle .w {
        display: inline-block;
        transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
      }
      .cycle .w.out {
        opacity: 0;
        transform: translateY(-6px);
      }
      .cycle .w.in {
        opacity: 0;
        transform: translateY(6px);
        transition: none;
      }
      .cycle .w::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: -3px;
        height: 1px;
        background: var(--gold);
        transform-origin: left;
        transform: scaleX(0);
        animation: underline 2.6s linear infinite;
      }
      @keyframes underline {
        to {
          transform: scaleX(1);
        }
      }

      /* footer */
      .foot {
        background: var(--black);
        color: var(--grey-4);
        font-size: 13px;
      }
      .foot .wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px 24px;
        flex-wrap: wrap;
        padding-block: 22px;
      }
      .foot .logo img {
        height: 26px;
      }
      .foot .links {
        display: flex;
        gap: 18px;
        flex-wrap: wrap;
      }
      .foot a:hover {
        color: var(--white);
      }

      /* page-load sequence: one orchestrated moment */
      html.js .sig {
        transform: scaleX(0);
      }
      html.js .hero .sub,
      html.js .notify,
      html.js .cycle {
        opacity: 0;
        transform: translateY(10px);
      }
      html.js.loaded .sig {
        transform: none;
        transition: transform 0.6s var(--ease) 0.05s;
      }
      html.js.loaded .hero .sub,
      html.js.loaded .notify,
      html.js.loaded .cycle {
        opacity: 1;
        transform: none;
        transition: opacity 0.6s var(--ease), transform 0.6s var(--ease);
      }
      html.js.loaded .hero .sub {
        transition-delay: 0.2s;
      }
      html.js.loaded .notify {
        transition-delay: 0.35s;
      }
      html.js.loaded .cycle {
        transition-delay: 0.5s;
      }
      @media (prefers-reduced-motion: reduce) {
        html.js .sig,
        html.js .hero .sub,
        html.js .notify,
        html.js .cycle {
          transform: none;
          opacity: 1;
          transition: none;
        }
        .glow,
        .caret {
          animation: none;
        }
        .caret {
          display: none !important;
        }
        .cycle .w::after {
          animation: none;
          transform: scaleX(1);
        }
      }
      @media (max-width: 600px) {
        .hero {
          padding: 40px 0 64px;
        }
        .hero h1 {
          font-size: clamp(52px, 17vw, 80px);
        }
        .notify .field {
          flex-direction: column;
        }
        .notify button {
          padding: 12px;
        }
      }
    
      /* The Founders Doc mark: the wordmark ruled above and below. Replaces the
         hosted PNG so the logo never depends on a file loading, and inherits
         currentColor so one rule serves the nav and the dark footer. */
      .fd-mark {
        display: inline-block;
        font-family: var(--sans);
        font-size: 11.5px;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        line-height: 1;
        padding: 7px 10px 6px 12px;
        border-top: 1px solid currentColor;
        border-bottom: 1px solid currentColor;
        white-space: nowrap;
      }
      .foot .fd-mark { color: #fff; }
    </style>
  </head>
  <body>
    <nav class="nav" aria-label="Site">
      <div class="wrap">
        <a class="logo" href="/" aria-label="Founders Doc — home"
          ><span class="fd-mark">Founders Doc</span></a>
        <a class="back" href="/">&larr; Back to home</a>
      </div>
    </nav>

    <main class="hero" id="top">
      <div class="glow" aria-hidden="true"></div>
      <div class="wrap">
        <h1>
          <span class="line"><span><span class="typed" data-text="Coming soon">Coming soon</span><i class="caret" aria-hidden="true"></i></span></span>
        </h1>
        <span class="sig" aria-hidden="true"></span>
        <p class="sub"><span id="feat">A new feature</span> is on its way. Be the first to hear.</p>

        <form class="notify" id="notify-form" novalidate>
          <label for="em">Tell me when it lands</label>
          <div class="field">
            <input id="em" name="email" type="email" placeholder="Email address" autocomplete="email" required />
            <button type="submit">Notify me</button>
          </div>
          <p class="msg" id="notify-msg" aria-live="polite"></p>
        </form>

        <p class="cycle" aria-hidden="true">
          <span>Contracts we review and draft:</span>
          <span class="w-wrap"><span class="w on" data-w>NDAs</span></span>
        </p>

      </div>
    </main>

    <footer class="foot">
      <div class="wrap">
        <a class="logo" href="/" aria-label="Founders Doc — home"
          ><span class="fd-mark">Founders Doc</span></a>
        <div class="links">
          <a href="mailto:administrator@foundersdoc.com">administrator@foundersdoc.com</a>
          <a href="https://www.linkedin.com/company/foundersdoc/">LinkedIn</a>
          <a href="https://www.instagram.com/foundersdoc/">Instagram</a>
          <a href="https://www.youtube.com/channel/UCYQebtLCvD2esHthgPAxrFg">YouTube</a>
        </div>
        <span>© 2026 Founders Doc. All rights reserved.</span>
      </div>
    </footer>

    <script>
      // Personalise from ?f= — the homepage passes the feature name that was clicked.
      (function () {
        var f = new URLSearchParams(location.search).get("f");
        if (!f) return;
        f = f.replace(/[<>]/g, "").trim().slice(0, 60);
        if (!f) return;
        var el = document.getElementById("feat");
        if (el) el.textContent = f;
        document.title = f + " — coming soon | Founders Doc";
      })();

      (function () {
        var root = document.documentElement,
          reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches,
          typed = document.querySelector(".typed"),
          text = typed.getAttribute("data-text");
        // Type the headline once fonts are ready (or shortly after), then hand off to the rest of the entrance.
        var started = false;
        function start() {
          if (started) return;
          started = true;
          if (reduce) {
            root.classList.add("loaded");
            return;
          }
          typed.textContent = "";
          root.classList.add("typing");
          var i = 0;
          function tick() {
            typed.textContent = text.slice(0, ++i);
            if (i < text.length) {
              setTimeout(tick, text[i - 1] === " " ? 160 : 70 + Math.random() * 50);
            } else {
              setTimeout(function () {
                root.classList.remove("typing");
                root.classList.add("loaded");
              }, 260);
            }
          }
          setTimeout(tick, 380);
        }
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(start);
        setTimeout(start, 600);

        // Cycle through the contract types (paused under reduced motion)
        var w = document.querySelector("[data-w]"),
          words = ["NDAs", "shareholders' agreements", "employment agreements", "services agreements", "terms & conditions", "fundraising documents"],
          wi = 0;
        if (w && !reduce) {
          setInterval(function () {
            w.classList.add("out");
            setTimeout(function () {
              wi = (wi + 1) % words.length;
              w.textContent = words[wi];
              w.classList.remove("out");
              w.classList.add("in");
              void w.offsetWidth;
              w.classList.remove("in");
            }, 360);
          }, 2600);
        }

        // Notify form: validate client-side. Point `action` at your email provider (e.g. Mailchimp) when ready.
        var form = document.getElementById("notify-form"),
          msg = document.getElementById("notify-msg"),
          em = document.getElementById("em");
        form.addEventListener("submit", function (e) {
          e.preventDefault();
          if (!em.value || !em.checkValidity()) {
            msg.className = "msg err";
            msg.textContent = "Enter a valid email address to be notified.";
            em.focus();
            return;
          }
          msg.className = "msg ok";
          msg.textContent = "Thanks — you'll hear from us first.";
          form.reset();
        });
      })();
    </script>
  <script defer src="/fd-track.js"></script>
</body>
</html>
